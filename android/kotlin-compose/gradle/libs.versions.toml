[versions]

# AndroidX
activityCompose = "1.13.0"
androidx_appcompat = "1.7.1"
androidx_constraintlayout = "2.2.1"
androidx_core = "1.17.0"

# Google
google_material = "1.14.0"

# Gradle
#noinspection AndroidGradlePluginVersion
gradle_android_plugin = "8.9.3"
gradle_kotlin_plugin = "2.4.0"

# Kotlin
junit = "4.13.2"

# Ouinet
kotlinVersion = "2.4.0"
materialIconsExtended = "1.7.8"
navigationComposeVersion = "2.9.0"
ouinet_version = "1.6.8"
relinker_version = "1.4.5"

# Third Party
okhttp = "4.9.3"

# Testing
testing_androidx_core = "1.5.0"
testing_androidx_ext_junit = "1.3.0"
runtime = "1.11.4"
material3 = "1.4.0"
navigationCompose = "2.9.8"
uiText = "1.11.4"
uiToolingPreview = "1.11.4"
uiTooling = "1.11.4"
uiTest = "1.11.4"

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "gradle_kotlin_plugin" }

[libraries]

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx_appcompat" }
androidx-corektx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx_core" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx_constraintlayout" }

androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google_material" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinVersion" }
tools-androidgradle = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle_android_plugin" }
tools-kotlingradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "gradle_kotlin_plugin" }

junit = { module = "junit:junit", version.ref = "junit" }
tools-testcore = { group = "androidx.test", name = "core", version.ref = "testing_androidx_core" }
tools-testcorektx = { group = "androidx.test", name = "core-ktx", version.ref = "testing_androidx_core" }
tools-testrules = { group = "androidx.test", name = "rules", version.ref = "testing_androidx_core" }
tools-testrunner = { group = "androidx.test", name = "runner", version.ref = "testing_androidx_core" }
tools-testjunit = { group = "androidx.test.ext", name = "junit", version.ref = "testing_androidx_ext_junit" }
tools-testjunitktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "testing_androidx_ext_junit" }

ouinet-omni = { group = "ie.equalit.ouinet", name = "ouinet-omni", version.ref = "ouinet_version" }
relinker = { group = "com.getkeepsafe.relinker", name = "relinker", version.ref = "relinker_version" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "uiText" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "uiToolingPreview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "uiTooling" }
androidx-ui-test = { group = "androidx.compose.ui", name = "ui-test", version.ref = "uiTest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "uiTest" }
